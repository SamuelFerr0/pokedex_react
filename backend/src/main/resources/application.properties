spring.application.name=pokedex
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}
spring.mongodb.representation.big-decimal=decimal128
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
app.seed=${SEED_DATA:true}
server.error.include-message=never
